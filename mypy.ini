[mypy]
python_version = 3.13
files = app.py, src/coffee_recommender
mypy_path = src
explicit_package_bases = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
disable_error_code = import-untyped

[mypy-coffee_recommender.parse_review]
ignore_errors = True

[mypy-coffee_recommender.process_data.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True
